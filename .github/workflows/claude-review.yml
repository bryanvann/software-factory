name: Claude PR Review

# Separate-context reviewer. Runs on GitHub, not on the Mac, so it survives the
# machine being off and never shares context with the worker that wrote the code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review the diff against its spec
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Separate-context review is the highest-leverage quality gate in the
          # pipeline (~75% useful findings vs <50% for self-review), and its
          # output gates merges. Worth the strongest model.
          claude_args: "--model <your-strongest-model>"
          prompt: |
            Review this pull request.

            First, find the spec it links to under docs/specs/ and read it, plus
            AGENTS.md. Review the diff AGAINST THE SPEC, in this order:

            1. Correctness — does it do what the spec's acceptance criteria say?
            2. Scope — does it do anything the spec did NOT ask for, or anything
               listed under Non-goals? Flag every out-of-scope change.
            3. Conventions — does it violate anything in AGENTS.md?
            4. Risk — untested edge cases, error paths, and anything touching
               the areas AGENTS.md flags as failure-prone.

            Be specific and cite file:line. Do not restate what the diff does.
            If the PR is good, say so briefly and approve rather than inventing
            findings — a reviewer that always finds something trains the worker
            to ignore it.
